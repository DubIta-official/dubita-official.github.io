name: Video parlato

# Crea il video «DubITA ti consiglia un anime» con la voce AI italiana (strumenti/video/parlato.js).
# Si avvia a mano; il video finisce nel ramo «video-parlato» (sovrascritto a ogni esecuzione).

on:
  workflow_dispatch:
    inputs:
      voce:
        description: "Voce (es. it-IT-DiegoNeural, it-IT-ElsaNeural, it-IT-IsabellaNeural, it-IT-GiuseppeMultilingualNeural)"
        required: false
        default: "it-IT-DiegoNeural"

permissions:
  contents: write

jobs:
  parlato:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Strumenti
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji > /dev/null
          pip install -q edge-tts
          npm i --no-save --silent playwright@1.48.2
          npx playwright install --with-deps chromium > /dev/null
      - name: Video
        run: node strumenti/video/parlato.js "$RUNNER_TEMP/parlato" "${{ github.event.inputs.voce || 'it-IT-DiegoNeural' }}"
      - name: Salva nel ramo video-parlato
        run: |
          cd "$RUNNER_TEMP/parlato" && rm -rf audio voce.wav && git init -q -b video-parlato
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Video parlato $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" video-parlato
