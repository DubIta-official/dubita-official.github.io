name: Video DaVedere

# Crea un video lungo «#DaVedere» con la voce AI italiana (strumenti/video/davedere.js).
# Si avvia a mano scegliendo il testo (file in strumenti/video/davedere/); il video finisce nel ramo «video-davedere».

on:
  workflow_dispatch:
    inputs:
      testo:
        description: "Nome del testo, senza .json (es. solo-leveling)"
        required: true
      voce:
        description: "Voce (it-IT-DiegoNeural, it-IT-ElsaNeural, it-IT-IsabellaNeural)"
        required: false
        default: "it-IT-DiegoNeural"

permissions:
  contents: write

jobs:
  davedere:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Strumenti
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji fonts-inter > /dev/null
          pip install -q edge-tts
          npm i --no-save --silent playwright@1.48.2
          npx playwright install --with-deps chromium > /dev/null
      - name: Video
        run: node strumenti/video/davedere.js "strumenti/video/davedere/${{ github.event.inputs.testo }}.json" "$RUNNER_TEMP/davedere" "${{ github.event.inputs.voce || 'it-IT-DiegoNeural' }}"
      - name: Salva nel ramo video-davedere
        run: |
          cd "$RUNNER_TEMP/davedere" && git init -q -b video-davedere
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Video DaVedere $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" video-davedere
