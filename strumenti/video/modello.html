<!doctype html>
<html><head><meta charset="utf-8">
<!-- Modello dei video verticali di DubITA (1080×1920). Lo usa rendi.js: i dati arrivano in window.VIDEO = {scenes:[…]}.
     Tutto è funzione del tempo t, così ogni fotogramma è identico a ogni render. © 2026 DubITA -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0b0820;font-family:"Inter Display","Inter","DejaVu Sans",sans-serif;color:#fff}
#stage{position:absolute;inset:0;overflow:hidden}
.bg{position:absolute;inset:-200px;background:radial-gradient(circle at 50% 40%,#1d1450 0%,#0b0820 60%)}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55}
.grain{position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 2px,transparent 2px 4px)}
.scene{position:absolute;inset:0;opacity:0}
.abs{position:absolute;white-space:nowrap}
.c{left:0;right:0;text-align:center}
.wrap{white-space:normal}
.grad{background:linear-gradient(90deg,#ff4fa3,#b44dff 50%,#4d8bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.chip{display:inline-block;padding:14px 30px;border-radius:999px;font-weight:800;font-size:34px;letter-spacing:.06em;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.18)}
.kata{color:#3ee0ff;font-family:"IPAPGothic",sans-serif;font-weight:700}
.row{display:flex;align-items:center;gap:28px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.12);border-radius:34px;padding:34px 36px;margin-bottom:26px}
.row .t{font-weight:800;font-size:52px;line-height:1.1;flex:1;white-space:normal}
.row .d{font-weight:900;font-size:34px;padding:10px 20px;border-radius:16px;white-space:nowrap;color:#0b0820}
.bar{position:absolute;left:0;top:0;height:10px;background:linear-gradient(90deg,#ff4fa3,#b44dff,#4d8bff)}
.flag{display:inline-flex;height:.22em;width:2.4em;border-radius:6px;overflow:hidden;vertical-align:middle}
.flag i{flex:1}
.card{background:rgba(255,255,255,.08);border:3px solid rgba(255,255,255,.16);border-radius:44px;padding:56px 50px;text-align:center}
.stamp{display:inline-block;font-weight:900;font-size:150px;letter-spacing:-.01em;padding:10px 54px;border-radius:36px;border:12px solid currentColor;line-height:1.05}
.info{display:inline-block;font-weight:800;font-size:46px;padding:18px 36px;border-radius:24px;background:rgba(255,255,255,.1);margin:10px}
.mark{position:absolute;left:70px;top:1540px;font-weight:900;font-size:40px;opacity:.55}
.slot{position:absolute;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.07);border:3px solid rgba(255,255,255,.16);display:flex;align-items:center}
.slot img{height:100%;width:100%;object-fit:cover;display:block}
.slot .th{height:100%;flex:none;width:68px;background:#2a2060 center/cover}
.slot .nm{flex:1;padding:0 10px;font-weight:900;line-height:1.02;white-space:normal}
.slot .q{width:100%;text-align:center;font-weight:900;font-size:40px;opacity:.35}
.slot.cur{border-color:#fff;box-shadow:0 0 0 4px #ff4fa3,0 0 40px #ff4fa3}
.slot.lose{opacity:.38;filter:grayscale(1)}
.slot.win{border-color:#2ee59d;box-shadow:0 0 26px #2ee59d88}
.xx{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#ff3b4a;font-weight:900;font-size:90px;text-shadow:0 0 20px #000}
.cover{position:absolute;left:0;right:0;overflow:hidden}
.cover .im{position:absolute;inset:-40px;background:#2a2060 center/cover;filter:saturate(1.15)}
.cover .sh{position:absolute;inset:0}
.vsname{position:absolute;left:60px;right:60px;font-weight:900;letter-spacing:-.02em;line-height:1;text-shadow:0 6px 30px rgba(0,0,0,.8);white-space:normal}
.vs{font-weight:900;font-size:260px;line-height:1;font-style:italic;letter-spacing:-.04em;-webkit-text-stroke:6px #0b0820;paint-order:stroke fill}
.tile{position:absolute;border-radius:28px;overflow:hidden;background:#2a2060;border:3px solid rgba(255,255,255,.18)}
.tile .im{position:absolute;inset:0;background:#2a2060 center/cover}
.tile .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,8,32,0) 35%,rgba(11,8,32,.92) 100%)}
.tile .tx{position:absolute;left:18px;right:18px;bottom:16px;font-weight:900;font-size:34px;line-height:1.05;white-space:normal}
.tile .ep{display:inline-block;margin-top:8px;font-weight:800;font-size:26px;opacity:.85}
.tile .pl{position:absolute;top:14px;left:14px;font-weight:900;font-size:24px;padding:8px 14px;border-radius:12px;color:#0b0820}
.mtile{position:absolute;overflow:hidden;background:#2a2060 center/cover}
.mtile i{position:absolute;inset:0;background:inherit;background-size:cover;background-position:center}
.prow{position:absolute;left:50px;right:50px;display:flex;align-items:center;gap:0;border-radius:26px;background:rgba(255,255,255,.07);border:3px solid rgba(255,255,255,.12)}
.prow .side{flex:1;display:flex;align-items:center;gap:18px;min-width:0;height:100%;padding:0 14px}
.prow .side.r{flex-direction:row-reverse;text-align:right}
.prow .pc{flex:none;height:calc(100% - 20px);aspect-ratio:2/3;border-radius:12px;background:#2a2060 center/cover;border:2px solid rgba(255,255,255,.2)}
.prow .pn{font-weight:900;line-height:1.02;white-space:normal;min-width:0}
.prow .mid{flex:none;width:86px;text-align:center;font-weight:900;font-style:italic;font-size:42px;opacity:.55}
.prow.cur{border-color:#fff;background:rgba(255,79,163,.18);box-shadow:0 0 0 4px #ff4fa3,0 0 50px #ff4fa388}
.prow.cur .mid{opacity:1;color:#ff4fa3}
.prow .side.lose{opacity:.35;filter:grayscale(1)}
.prow .side.win .pc{border-color:#2ee59d;box-shadow:0 0 22px #2ee59d}
.prow .tag{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-weight:900;font-size:26px;letter-spacing:.1em;padding:6px 16px;border-radius:10px;background:#ff4fa3;color:#fff}
.vnum{display:inline-flex;align-items:center;justify-content:center;width:1.15em;height:1.15em;border-radius:22%;font-style:normal;margin:0 .25em;vertical-align:.08em;font-size:.8em;color:#0b0820}
.vplate{display:inline;padding:.04em .2em;border-radius:.16em;background:rgba(11,8,32,.62);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.gimg{position:absolute;left:90px;right:90px;top:430px;height:1050px;border-radius:44px;overflow:hidden;border:4px solid rgba(255,255,255,.2);background:#2a2060}
.gimg .im{position:absolute;inset:0;background:#2a2060 center/cover}
.ring{position:absolute;left:50%;top:1530px;width:150px;height:150px;margin-left:-75px}
</style></head>
<body><div id="stage"></div>
<script>
const V = window.VIDEO || {scenes: [
  {type: "hook", chip: "QUIZ", lines: ["DOPPIATO", "O NO?"], accent: 1},
  {type: "quiz", n: "1/3", title: "Solo Leveling", sub: "1ª stagione", verdict: "SÌ", tone: "yes", info: ["Crunchyroll"]},
  {type: "outro"}
]};
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, s, d) => clamp((t - s) / d);
const E = {out: x => 1 - Math.pow(1 - x, 3), back: x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }, in: x => x * x * x};
const stage = document.getElementById("stage");
const el = (tag, cls, html, parent) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; (parent || stage).appendChild(e); return e; };
const set = (e, o, x = 0, y = 0, sc = 1, blur = 0, rot = 0, pre = "") => { e.style.opacity = o; e.style.transform = `${pre} translate(${x}px,${y}px) scale(${sc}) rotate(${rot}deg)`; e.style.filter = blur > .3 ? `blur(${blur}px)` : "none"; };
const TONE = {yes: "#2ee59d", partial: "#3ee0ff", soon: "#ffc53d", no: "#ff4d6a"};
const esc = s => String(s).replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c]));
// dimensione del carattere perché il testo stia in "w" pixel (stima: una lettera maiuscola nera è larga circa 0,64 em)
const fit = (txt, max, min, w = 940, k) => { const up = txt === txt.toUpperCase(); k = k || (up ? .66 : .56); return Math.max(min, Math.min(max, Math.floor(w / (Math.max(1, txt.length) * k)))); };

el("div", "bg");
const blobs = [["#ff4fa3", 620], ["#4d8bff", 700], ["#b44dff", 560], ["#3ee0ff", 380]].map(([c, s]) => { const b = el("div", "blob"); b.style.cssText += `width:${s}px;height:${s}px;background:${c}`; return b; });
el("div", "grain");
const bar = el("div", "bar");

/* ---------- tipi di scena: ognuno restituisce {dur, draw(lt)} ---------- */
const B = {};
B.hook = (d, s) => {
  const chip = el("div", "chip abs", `<span class="kata">ダブ</span>&nbsp; ${esc(d.chip || "DOPPIAGGI ITA")}`, s); chip.style.cssText += "left:50%;top:400px";
  const n = d.lines.length;
  const hs = d.lines.map((txt, i) => { const big = i === (d.accent ?? n - 1); const h = el("div", "abs c" + (big ? " grad" : ""), esc(txt), s);
    const fs = big ? fit(txt, 200, 90) : fit(txt, 135, 76);
    h.style.cssText += `font-weight:900;letter-spacing:-.02em;top:${(n > 3 ? 560 : 640) + i * 180}px;font-size:${fs}px;line-height:1`; return h; });
  const flag = el("div", "abs", `<span class="flag"><i style="background:#1fb35a"></i><i style="background:#fff"></i><i style="background:#ff3b4a"></i></span>`, s);
  flag.style.cssText += `left:50%;top:${(n > 3 ? 560 : 640) + n * 180 + 60}px;font-size:120px`;
  return {dur: d.dur || 1 + n * .4 + 1.1, draw(lt) {
    const p = E.back(prog(lt, .05, .45)); chip.style.opacity = prog(lt, .05, .3); chip.style.transform = `translateX(-50%) translateY(${(1 - p) * -60}px)`;
    hs.forEach((h, i) => { const st = .25 + i * .38, k = prog(lt, st, .32), big = h.classList.contains("grad");
      const sc = big ? 2.6 - 1.6 * E.out(k) : 1.8 - .8 * E.out(k), kk = prog(lt, st + .3, .25);
      const sh = kk > 0 && kk < 1 ? Math.sin(kk * 40) * 14 * (1 - kk) : 0, pulse = big && lt > st + .6 ? 1 + Math.sin((lt - st - .6) * 6) * .025 : 1;
      set(h, k > 0 ? clamp(k * 3) : 0, sh, 0, sc * pulse, (1 - E.out(k)) * 18); });
    const f = E.out(prog(lt, .3 + n * .38, .5)); flag.style.opacity = f; flag.style.transform = `translateX(-50%) scaleX(${f})`;
  }};
};
B.list = (d, s) => {
  const color = d.color || "#b44dff";
  const head = el("div", "abs", "", s); head.style.cssText += "left:70px;right:70px;top:250px";
  const lab = el("div", "", esc(d.label || ""), head); lab.style.cssText = "font-weight:800;font-size:40px;letter-spacing:.14em;opacity:.75";
  const name = el("div", "", esc(d.title), head); name.style.cssText = `font-weight:900;font-size:${fit(d.title, 150, 80)}px;letter-spacing:-.02em;line-height:1.05;color:${color};text-shadow:0 0 60px ${color}66;transform-origin:left center`;
  const under = el("div", "", "", head); under.style.cssText = `height:14px;border-radius:8px;background:${color};margin-top:18px;transform-origin:left`;
  const list = el("div", "abs", "", s); list.style.cssText += "left:70px;right:70px;top:600px;bottom:400px;display:flex;flex-direction:column;justify-content:center";
  const rows = d.items.map(([t, x]) => { const r = el("div", "row", `<div class="t">${esc(t)}</div>` + (x ? `<div class="d" style="background:${color}">${esc(x)}</div>` : ""), list); r.style.borderColor = color + "55"; return r; });
  const count = el("div", "abs", `${d.items.length}`, s); count.style.cssText += `right:40px;bottom:330px;font-weight:900;font-size:420px;line-height:1;color:${color}22`;
  return {dur: d.dur || 1.3 + d.items.length * .5 + 1.2, draw(lt) {
    set(name, prog(lt, .05, .15), 0, 0, .6 + .4 * E.back(prog(lt, .05, .4)));
    under.style.transform = `scaleX(${E.out(prog(lt, .25, .5))})`;
    count.style.transform = `translateY(${(1 - E.out(prog(lt, .1, .6))) * 80}px)`;
    rows.forEach((r, i) => { const k = prog(lt, .45 + i * .3, .4); set(r, clamp(k * 2), (1 - E.back(k)) * 700, 0, 1, (1 - E.out(k)) * 10);
      const hl = prog(lt, .8 + i * .3, .25); r.style.background = `rgba(255,255,255,${.07 + (hl > 0 && hl < 1 ? (1 - hl) * .18 : 0)})`; });
  }};
};
B.quiz = (d, s) => {   // un anime: titolo, suspense, timbro con la risposta
  const col = TONE[d.tone] || TONE.yes;
  const n = el("div", "abs c", esc(d.n ? `${d.n}` : ""), s); n.style.cssText += "top:250px;font-weight:900;font-size:44px;letter-spacing:.2em;opacity:.7";
  const q = el("div", "abs c", esc(d.question || "È DOPPIATO IN ITALIANO?"), s); q.style.cssText += "top:320px;font-weight:900;font-size:62px";
  const card = el("div", "abs card wrap", `<div style="font-weight:900;font-size:${fit(d.title.split(" ").reduce((a, b) => a.length > b.length ? a : b, ""), 118, 64, 860)}px;line-height:1.05">${esc(d.title)}</div>` + (d.sub ? `<div style="font-weight:700;font-size:46px;opacity:.75;margin-top:18px">${esc(d.sub)}</div>` : ""), s);
  card.style.cssText += "left:70px;right:70px;top:500px";
  const meter = el("div", "abs", "", s); meter.style.cssText += "left:170px;right:170px;top:1010px;height:16px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden";
  const fill = el("div", "", "", meter); fill.style.cssText = "height:100%;width:100%;background:linear-gradient(90deg,#ff4fa3,#b44dff,#4d8bff);transform-origin:left";
  const stamp = el("div", "abs c", `<span class="stamp" style="color:${col};text-shadow:0 0 50px ${col}88;box-shadow:0 0 60px ${col}55, inset 0 0 40px ${col}33">${esc(d.verdict)}</span>`, s); stamp.style.cssText += "top:1070px";
  const info = el("div", "abs c wrap", (d.info || []).map(x => `<span class="info">${esc(x)}</span>`).join(""), s); info.style.cssText += "top:1340px;padding:0 60px";
  const flash = el("div", "abs", "", s); flash.style.cssText += `inset:0;background:${col};opacity:0`;
  const T = .9, R = 2.1;   // titolo pronto, risposta
  return {dur: d.dur || 4.6, draw(lt) {
    const y = 500 + card.offsetHeight;   // tutto sotto la scheda, che può essere alta 1-4 righe
    meter.style.top = (y + 60) + "px"; stamp.style.top = (y + 110) + "px"; info.style.top = (y + 390) + "px";
    set(n, prog(lt, 0, .2)); set(q, prog(lt, .05, .25), 0, (1 - E.out(prog(lt, .05, .35))) * -40);
    const c = prog(lt, .15, .45); set(card, clamp(c * 2), 0, (1 - E.back(c)) * 260, .85 + .15 * E.out(c), (1 - E.out(c)) * 14);
    meter.style.opacity = lt < R ? prog(lt, T, .15) : 1 - prog(lt, R, .2);
    fill.style.transform = `scaleX(${1 - prog(lt, T, R - T)})`;
    const k = prog(lt, R, .28); set(stamp, k > 0 ? 1 : 0, 0, 0, 3 - 2 * E.out(k), (1 - E.out(k)) * 20, -6 + (1 - k) * -10);
    const sh = prog(lt, R + .28, .25); if (sh > 0 && sh < 1) card.style.transform += ` translateX(${Math.sin(sh * 40) * 16 * (1 - sh)}px)`;
    flash.style.opacity = (k > .8 ? (1 - prog(lt, R + .25, .3)) * .35 : 0);
    const ip = prog(lt, R + .45, .4); set(info, ip, 0, (1 - E.out(ip)) * 50);
  }};
};
B.outro = (d, s) => {
  const lines = d.lines || ["Il tuo anime", "è doppiato?"];
  const q = lines.map((txt, i) => { const h = el("div", "abs c", esc(txt), s); h.style.cssText += `font-weight:900;font-size:${fit(txt, 130, 70)}px;line-height:1;top:${330 + i * 150}px`; return h; });
  const logo = el("div", "abs c", `<div class="kata" style="font-size:70px;letter-spacing:.3em">ダブ</div><div style="font-weight:900;font-size:250px;line-height:.95">Dub<br><span class="grad">ITA</span></div>`, s); logo.style.cssText += "top:690px";
  const url = el("div", "abs chip", esc(d.url || "dubita-official.github.io"), s); url.style.cssText += "left:50%;top:1320px;font-size:46px;padding:20px 40px";
  const follow = el("div", "abs c", esc(d.cta || "Cercalo sul sito · Seguici per i nuovi doppiaggi"), s); follow.style.cssText += "top:1460px;font-weight:700;font-size:38px;opacity:.75";
  return {dur: d.dur || 3.4, draw(lt) {
    q.forEach((h, i) => { const k = prog(lt, .05 + i * .25, .35); set(h, clamp(k * 2), 0, (1 - E.back(k)) * 120, 1, (1 - E.out(k)) * 14); });
    const lp = prog(lt, .7, .5); set(logo, clamp(lp * 2), 0, 0, (.4 + .6 * E.back(lp)) * (lt > 1.3 ? 1 + Math.sin((lt - 1.3) * 5) * .02 : 1), (1 - E.out(lp)) * 20);
    const up = E.back(prog(lt, 1.2, .4)); url.style.opacity = clamp(up * 2); url.style.transform = `translateX(-50%) scale(${.6 + .4 * up})`;
    set(follow, prog(lt, 1.6, .4), 0, (1 - E.out(prog(lt, 1.6, .4))) * 30);
  }};
};


const imgUrl = x => x ? (x.startsWith("http") || x.startsWith("file:") ? x : "file://" + x) : "";
// senza copertina: sfumatura colorata diversa per ogni nome
const tinta = n => { let h = 0; for (const c of String(n)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const bgImg = (x, n) => x ? `background-image:url('${imgUrl(x)}')` : `background:linear-gradient(135deg,hsl(${tinta(n)},85%,55%),hsl(${(tinta(n) + 60) % 360},80%,30%))`;
const iniz = n => String(n).replace(/[^A-Za-z0-9 ]/g, "").split(" ").filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();

/* tabellone a 16: d.slots = [r0 (16), r1 (8), r2 (4), r3 (2), r4 (1)], ogni posto {n, img, esito: "win"|"lose"} o null;
   d.cur = [round, indice sfida] da evidenziare; d.title, d.label */
B.bracket = (d, s) => {
  const top = 430, step = 130, H = 96;
  const ys = [[...Array(16)].map((_, i) => top + (i % 8) * step + H / 2)];
  for (let r = 1; r <= 3; r++) ys[r] = [...Array(16 >> r)].map((_, i) => { const h = 8 >> r, side = Math.floor(i / h), j = i % h; return (ys[r - 1][side * (h * 2) + 2 * j] + ys[r - 1][side * (h * 2) + 2 * j + 1]) / 2; });
  const XL = [24, 252, 350, 448], W = [214, 84, 84, 84];
  const pos = (r, i) => { if (r === 4) return {x: 490, y: 700, w: 100, h: 120};
    const per = 8 >> r, right = i >= per, w = W[r], x = right ? 1080 - XL[r] - w : XL[r]; return {x, y: ys[r][i] - H / 2, w, h: H}; };
  const title = el("div", "abs c", esc(d.title || "TORNEO ANIME"), s); title.style.cssText += "top:220px;font-weight:900;font-size:84px;letter-spacing:-.01em";
  const lab = el("div", "abs c", esc(d.label || ""), s); lab.style.cssText += "top:320px;font-weight:800;font-size:36px;letter-spacing:.12em;opacity:.75";
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg"); svg.setAttribute("width", 1080); svg.setAttribute("height", 1920); svg.style.cssText = "position:absolute;left:0;top:0"; s.appendChild(svg);
  const lines = [];
  const line = (pts, hot) => { const pl = document.createElementNS("http://www.w3.org/2000/svg", "polyline"); pl.setAttribute("points", pts.map(p => p.join(",")).join(" "));
    pl.setAttribute("fill", "none"); pl.setAttribute("stroke", hot ? "#2ee59d" : "rgba(255,255,255,.28)"); pl.setAttribute("stroke-width", hot ? 6 : 4); pl.setAttribute("stroke-linejoin", "round"); svg.appendChild(pl);
    const L = pts.reduce((a, p, i) => i ? a + Math.hypot(p[0] - pts[i - 1][0], p[1] - pts[i - 1][1]) : 0, 0); pl.style.strokeDasharray = L; lines.push({pl, L}); };
  for (let r = 0; r < 4; r++) for (let i = 0; i < (16 >> r); i++) {
    const a = pos(r, i), b = r < 3 ? pos(r + 1, i >> 1) : pos(4, 0), right = i >= (8 >> r), win = d.slots[r + 1] && d.slots[r + 1][r < 3 ? i >> 1 : 0] && d.slots[r][i] && d.slots[r][i].esito === "win";
    if (r < 3) { const x1 = right ? a.x : a.x + a.w, x2 = right ? b.x + b.w : b.x, xm = (x1 + x2) / 2; line([[x1, a.y + H / 2], [xm, a.y + H / 2], [xm, b.y + H / 2], [x2, b.y + H / 2]], win); }
    else line([[a.x + a.w / 2, a.y], [a.x + a.w / 2, b.y + b.h + 20], [b.x + b.w / 2, b.y + b.h + 20], [b.x + b.w / 2, b.y + b.h]], win);
  }
  const boxes = [];
  for (let r = 0; r <= 4; r++) for (let i = 0; i < (r === 4 ? 1 : 16 >> r); i++) {
    const p = pos(r, i), x = d.slots[r] && d.slots[r][i], b = el("div", "slot", "", s);
    b.style.cssText += `left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px`;
    if (r === 4) b.style.borderColor = "#ffc53d";
    if (!x) b.innerHTML = `<div class="q">${r === 4 ? "🏆" : "?"}</div>`;
    else if (r === 0) b.innerHTML = `<div class="th" style="${bgImg(x.img, x.n)};display:flex;align-items:center;justify-content:center;font-weight:900;font-size:30px">${x.img ? "" : esc(iniz(x.n))}</div><div class="nm" style="font-size:${Math.max(17, Math.min(30, Math.floor(132 / (Math.max(...x.n.split(" ").map(w => w.length)) * .64)), Math.floor(132 * 2.2 / (x.n.length * .6))))}px">${esc(x.n)}</div>`;
    else b.innerHTML = x.img ? `<img src="${imgUrl(x.img)}">` : `<div class="q" style="${bgImg("", x.n)};height:100%;display:flex;align-items:center;justify-content:center;font-size:34px;opacity:1">${esc(iniz(x.n))}</div>`;
    if (x && x.esito === "lose") { b.classList.add("lose"); el("div", "xx", "✕", b); }
    if (x && x.esito === "win" && r === 4) b.classList.add("win");
    const cur = d.cur && d.cur[0] === r && (i >> 1) === d.cur[1];
    if (cur) b.classList.add("cur");
    boxes.push({b, r, cur});
  }
  return {dur: d.dur || 3.6, draw(lt) {
    set(title, prog(lt, 0, .3), 0, (1 - E.out(prog(lt, 0, .4))) * -40); set(lab, prog(lt, .15, .3));
    lines.forEach(({pl, L}, i) => { pl.style.strokeDashoffset = L * (1 - E.out(prog(lt, .35 + (i % 16) * .015, .6))); });
    boxes.forEach(({b, r, cur}, i) => { const k = prog(lt, .1 + r * .18 + (i % 8) * .025, .35);
      let sc = .5 + .5 * E.back(k); if (cur && lt > 1.2) sc *= 1 + Math.sin((lt - 1.2) * 7) * .06;
      b.style.opacity = clamp(k * 2); b.style.transform = `scale(${sc})`; });
  }};
};

/* sfida: d.a, d.b = {n, img}; d.chip; d.cta */
B.vs = (d, s) => {
  const half = (x, top, col) => { const c = el("div", "cover", `<div class="im" style="${bgImg(x.img, x.n)}">${x.img ? "" : `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:420px;opacity:.22">${esc(iniz(x.n))}</div>`}</div><div class="sh"></div>`, s);
    c.style.cssText += `top:${top}px;height:960px`; c.querySelector(".sh").style.background = top ? `linear-gradient(0deg,rgba(11,8,32,.15),rgba(11,8,32,.85) 92%), linear-gradient(0deg,${col}55,transparent)` : `linear-gradient(180deg,rgba(11,8,32,.15),rgba(11,8,32,.85) 92%), linear-gradient(180deg,${col}55,transparent)`; return c; };
  const A = half(d.a, 0, "#ff4fa3"), Bc = half(d.b, 960, "#4d8bff");
  const fa = Math.max(70, Math.min(150, Math.floor(960 / (Math.max(...d.a.n.split(" ").map(w => w.length)) * .62)))), fb = Math.max(70, Math.min(150, Math.floor(960 / (Math.max(...d.b.n.split(" ").map(w => w.length)) * .62))));
  const na = el("div", "vsname", (d.a.k ? `<span class="vnum" style="background:#ff4fa3">${esc(d.a.k)}</span>` : "") + `<span class="vplate">${esc(d.a.n)}</span>`, s); na.style.cssText += `top:560px;font-size:${fa}px`;
  const nb = el("div", "vsname", `<span class="vplate">${esc(d.b.n)}</span>` + (d.b.k ? `<span class="vnum" style="background:#4d8bff">${esc(d.b.k)}</span>` : ""), s); nb.style.cssText += `top:1080px;font-size:${fb}px;text-align:right`;
  const cut = el("div", "abs", "", s); cut.style.cssText += "left:-100px;right:-100px;top:950px;height:20px;background:linear-gradient(90deg,#ff4fa3,#b44dff,#4d8bff);transform:rotate(-6deg);box-shadow:0 0 40px #b44dff";
  const vs = el("div", "abs c vs grad", "VS", s); vs.style.cssText += "top:820px";
  const chip = el("div", "abs chip", esc(d.chip || ""), s); chip.style.cssText += "left:50%;top:240px;background:rgba(11,8,32,.6)";
  const cta = el("div", "abs c", esc(d.cta || "VOTA NEI COMMENTI 👇"), s); cta.style.cssText += "top:1420px;font-weight:900;font-size:60px;text-shadow:0 4px 20px #000";
  const flash = el("div", "abs", "", s); flash.style.cssText += "inset:0;background:#fff;opacity:0";
  return {dur: d.dur || 5, draw(lt) {
    const ka = E.out(prog(lt, 0, .5)), kb = E.out(prog(lt, .25, .5));
    A.style.transform = `translateX(${(1 - ka) * -1080}px)`; Bc.style.transform = `translateX(${(1 - kb) * 1080}px)`;
    A.querySelector(".im").style.transform = `scale(${1.15 - lt * .02})`; Bc.querySelector(".im").style.transform = `scale(${1.05 + lt * .02})`;
    set(na, prog(lt, .35, .3), (1 - E.back(prog(lt, .35, .4))) * -300); set(nb, prog(lt, .6, .3), (1 - E.back(prog(lt, .6, .4))) * 300);
    cut.style.opacity = prog(lt, .8, .1); cut.style.transform = `rotate(-6deg) scaleX(${E.out(prog(lt, .8, .3))})`;
    const v = prog(lt, 1.05, .3); set(vs, v > 0 ? 1 : 0, 0, 0, (4 - 3 * E.out(v)) * (lt > 1.6 ? 1 + Math.sin((lt - 1.6) * 8) * .04 : 1), (1 - E.out(v)) * 20, -8);
    flash.style.opacity = v >= 1 ? (1 - prog(lt, 1.35, .3)) * .5 : 0;
    const sh = prog(lt, 1.35, .3); stage.style.transform = sh > 0 && sh < 1 ? `translate(${Math.sin(sh * 50) * 18 * (1 - sh)}px,${Math.cos(sh * 43) * 12 * (1 - sh)}px)` : "";
    chip.style.opacity = prog(lt, .2, .3); chip.style.transform = "translateX(-50%)";
    set(cta, prog(lt, 1.8, .3), 0, 0, (lt > 2.1 ? 1 + Math.sin((lt - 2.1) * 6) * .05 : .7 + .3 * E.back(prog(lt, 1.8, .3))));
  }};
};

/* risultato della sfida precedente: d.win, d.lose = {n, img}; d.perc (facoltativo, es. "62%") */
B.result = (d, s) => {
  const lab = el("div", "abs c", esc(d.label || "HA VINTO"), s); lab.style.cssText += "top:260px;font-weight:900;font-size:110px;color:#2ee59d;text-shadow:0 0 50px #2ee59d88";
  const w = el("div", "tile", `<div class="im" style="${bgImg(d.win.img, d.win.n)}">${d.win.img ? "" : `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:300px;opacity:.25">${esc(iniz(d.win.n))}</div>`}</div><div class="sh"></div><div class="tx" style="font-size:64px">${esc(d.win.n)}${d.perc ? `<div class="ep" style="font-size:40px">${esc(d.perc)} dei voti</div>` : ""}</div>`, s);
  w.style.cssText += "left:190px;width:700px;top:430px;height:820px;border-color:#2ee59d;box-shadow:0 0 60px #2ee59d66";
  const l = el("div", "tile", `<div class="im" style="${bgImg(d.lose.img, d.lose.n)};filter:grayscale(1)"></div><div class="sh"></div><div class="tx" style="font-size:30px">${esc(d.lose.n)}</div><div class="xx" style="font-size:150px">✕</div>`, s);
  l.style.cssText += "left:640px;width:330px;top:1130px;height:300px;opacity:.9";
  return {dur: d.dur || 3, draw(lt) {
    set(lab, prog(lt, 0, .2), 0, 0, 2.2 - 1.2 * E.out(prog(lt, 0, .3)));
    const k = prog(lt, .2, .45); set(w, clamp(k * 2), 0, (1 - E.back(k)) * 300, .8 + .2 * E.out(k), 0, (1 - E.out(k)) * -6);
    const kl = prog(lt, .6, .35); set(l, clamp(kl * 2), (1 - E.out(kl)) * 300, 0, 1, 0, 8);
  }};
};

/* griglia di copertine: d.items = [{n, ep, img, pl, col}] (fino a 6) */
B.grid = (d, s) => {
  const color = d.color || "#3ee0ff";
  const head = el("div", "abs", "", s); head.style.cssText += "left:70px;right:70px;top:230px";
  el("div", "", esc(d.label || ""), head).style.cssText = "font-weight:800;font-size:38px;letter-spacing:.14em;opacity:.75";
  const name = el("div", "", esc(d.title), head); name.style.cssText = `font-weight:900;font-size:${fit(d.title, 130, 76)}px;letter-spacing:-.02em;line-height:1.05;color:${color};text-shadow:0 0 60px ${color}66`;
  const n = d.items.length, cols = 2, rows = Math.ceil(n / cols), gw = 450, gh = rows > 2 ? 330 : 480, gap = 30;
  const tiles = d.items.map((x, i) => { const t = el("div", "tile", `<div class="im" style="${bgImg(x.img, x.n)}"></div><div class="sh"></div>` +
      (x.pl ? `<div class="pl" style="background:${x.col || color}">${esc(x.pl)}</div>` : "") + `<div class="tx">${esc(x.n)}${x.ep ? `<br><span class="ep">${esc(x.ep)}</span>` : ""}</div>`, s);
    t.style.cssText += `left:${70 + (i % cols) * (gw + gap)}px;top:${450 + Math.floor(i / cols) * (gh + gap)}px;width:${gw}px;height:${gh}px`;
    if (gh < 400) t.querySelector(".tx").style.fontSize = "30px"; return t; });
  return {dur: d.dur || 1.4 + n * .45 + 1.6, draw(lt) {
    set(name, prog(lt, .05, .15), 0, 0, .6 + .4 * E.back(prog(lt, .05, .4))); name.style.transformOrigin = "left center";
    tiles.forEach((t, i) => { const k = prog(lt, .4 + i * .32, .4); set(t, clamp(k * 2), 0, (1 - E.back(k)) * 200, .7 + .3 * E.out(k), (1 - E.out(k)) * 12);
      const im = t.querySelector(".im"); im.style.transform = `scale(${1.12 - .08 * clamp((lt - .4 - i * .32) / 4)})`; });
  }};
};

/* muro di copertine: d.imgs = [{n, img}] (fino a 16), d.chip, d.lines, d.accent, d.cta */
B.mosaic = (d, s) => {
  const n = d.imgs.length, cols = n > 9 ? 4 : n > 4 ? 2 : 1, rows = Math.ceil(n / cols), tw = 1080 / cols, th = 1920 / rows;
  const wall = el("div", "abs", "", s); wall.style.cssText += "inset:0";
  const tiles = d.imgs.map((x, i) => { const t = el("div", "mtile", `<i style="${bgImg(x.img, x.n)}"></i>`, wall);
    t.style.cssText += `left:${(i % cols) * tw}px;top:${Math.floor(i / cols) * th}px;width:${tw + 1}px;height:${th + 1}px`; return t; });
  const dark = el("div", "abs", "", s); dark.style.cssText += "inset:0;background:radial-gradient(circle at 50% 46%,rgba(11,8,32,.9) 0%,rgba(11,8,32,.7) 42%,rgba(11,8,32,.25) 100%)";
  const chip = el("div", "chip abs", `<span class="kata">ダブ</span>&nbsp; ${esc(d.chip || "")}`, s); chip.style.cssText += "left:50%;top:560px;background:rgba(11,8,32,.75)";
  const hs = d.lines.map((txt, i) => { const big = i === (d.accent ?? 0); const h = el("div", "abs c" + (big ? " grad" : ""), esc(txt), s);
    h.style.cssText += `font-weight:900;letter-spacing:-.02em;top:${700 + i * 170}px;font-size:${big ? fit(txt, 190, 90) : fit(txt, 120, 70)}px;line-height:1;text-shadow:0 8px 40px rgba(0,0,0,.6)`; return h; });
  const cta = el("div", "abs c", esc(d.cta || ""), s); cta.style.cssText += `top:${720 + d.lines.length * 170 + 40}px;font-weight:900;font-size:56px`;
  return {dur: d.dur || 3.6, draw(lt) {
    tiles.forEach((t, i) => { const k = prog(lt, (i * 7 % n) * .035, .3); set(t, clamp(k * 2), 0, 0, 1.25 - .25 * E.out(k));
      t.firstChild.style.transform = `scale(${1.05 + .04 * Math.sin(lt * .8 + i)})`; });
    dark.style.opacity = prog(lt, .55, .35);
    chip.style.opacity = prog(lt, .7, .25); chip.style.transform = `translateX(-50%) scale(${.7 + .3 * E.back(prog(lt, .7, .35))})`;
    hs.forEach((h, i) => { const k = prog(lt, .85 + i * .3, .3); set(h, clamp(k * 3), 0, 0, (2.2 - 1.2 * E.out(k)) * (i === (d.accent ?? 0) && lt > 1.6 ? 1 + Math.sin((lt - 1.6) * 6) * .025 : 1), (1 - E.out(k)) * 16); });
    const c = prog(lt, 1.2 + d.lines.length * .3, .35); set(cta, c, 0, (1 - E.out(c)) * 40, lt > 2.6 ? 1 + Math.sin((lt - 2.6) * 6) * .04 : 1);
  }};
};

/* sfide di un turno: d.matches = [{a:{n,img,esito}, b:{...}, cur}], d.title, d.label */
B.pairs = (d, s) => {
  const title = el("div", "abs c", esc(d.title || "TORNEO ANIME"), s); title.style.cssText += "top:200px;font-weight:900;font-size:90px;letter-spacing:-.01em";
  const lab = el("div", "abs c", esc(d.label || ""), s); lab.style.cssText += "top:305px;font-weight:800;font-size:38px;letter-spacing:.14em;color:#3ee0ff";
  const m = d.matches.length, top = 390, avail = 1440 - top, gap = m > 4 ? 22 : 34, h = Math.min(250, Math.floor((avail - gap * (m - 1)) / m));
  const side = (x, r) => { if (!x) return `<div class="side${r ? " r" : ""}"><div class="pc"></div><div class="pn" style="font-size:40px;opacity:.4">?</div></div>`;
    const lw = Math.max(...x.n.split(" ").map(w => w.length)), fs = Math.max(26, Math.min(h > 160 ? 50 : 40, Math.floor(300 / (lw * .6)), Math.floor(300 * 2 / (x.n.length * .58))));
    return `<div class="side${r ? " r" : ""}${x.esito ? " " + x.esito : ""}"><div class="pc" style="${bgImg(x.img, x.n)}"></div><div class="pn" style="font-size:${fs}px">${esc(x.n)}</div></div>`; };
  const rows = d.matches.map((mt, i) => { const r = el("div", "prow" + (mt.cur ? " cur" : ""), side(mt.a, false) + `<div class="mid">VS</div>` + side(mt.b, true), s);
    r.style.cssText += `top:${top + i * (h + gap)}px;height:${h}px`;
    if (mt.cur) el("div", "tag", "OGGI SI VOTA", r);
    return {r, cur: mt.cur}; });
  return {dur: d.dur || 1.4 + m * .22 + 1.6, draw(lt) {
    set(title, prog(lt, 0, .25), 0, (1 - E.out(prog(lt, 0, .4))) * -50); set(lab, prog(lt, .15, .3));
    rows.forEach(({r, cur}, i) => { const k = prog(lt, .3 + i * .16, .35); let sc = .9 + .1 * E.out(k);
      if (cur && lt > 1.3 + m * .16) sc *= 1 + Math.sin((lt - 1.3 - m * .16) * 7) * .025;
      set(r, clamp(k * 2), (1 - E.back(k)) * (i % 2 ? 500 : -500), 0, sc); });
  }};
};

/* indovina dalla copertina: d.img, d.n, d.num ("1/4"), d.pill {t, col} facoltativa */
B.guess = (d, s) => {
  const n = el("div", "abs c", esc(d.num || ""), s); n.style.cssText += "top:230px;font-weight:900;font-size:44px;letter-spacing:.2em;opacity:.75";
  const q = el("div", "abs c", "CHE ANIME È?", s); q.style.cssText += "top:300px;font-weight:900;font-size:84px";
  const box = el("div", "gimg", `<div class="im" style="${bgImg(d.img, d.n)}"></div>`, s), im = box.firstChild;
  const svg = `<svg viewBox="0 0 150 150" width="150" height="150"><circle cx="75" cy="75" r="64" fill="rgba(11,8,32,.6)" stroke="rgba(255,255,255,.15)" stroke-width="12"/><circle class="arc" cx="75" cy="75" r="64" fill="none" stroke="#ff4fa3" stroke-width="12" stroke-linecap="round" stroke-dasharray="402" transform="rotate(-90 75 75)"/><text class="num" x="75" y="96" text-anchor="middle" font-size="64" font-weight="900" fill="#fff" font-family="Inter Display,Inter,sans-serif">3</text></svg>`;
  const ring = el("div", "ring", svg, s), arc = ring.querySelector(".arc"), num = ring.querySelector(".num");
  const name = el("div", "abs c wrap", `<span class="vplate">${esc(d.n)}</span>`, s);
  const lw = Math.max(...d.n.split(" ").map(w => w.length)); name.style.cssText += `left:70px;right:70px;top:1180px;font-weight:900;font-size:${Math.max(70, Math.min(130, Math.floor(900 / (lw * .6))))}px;line-height:1.08`;
  const pill = d.pill ? el("div", "abs c", `<span class="info" style="background:${d.pill.col};color:#0b0820">${esc(d.pill.t)}</span>`, s) : null;
  if (pill) pill.style.cssText += "top:1530px";
  const flash = el("div", "abs", "", s); flash.style.cssText += "inset:0;background:#fff;opacity:0";
  const R = d.reveal || 3.0;   // svelato
  const Z = d.zoom || 3.2, BL = d.blur || 22;
  return {dur: d.dur || R + 2.2, draw(lt) {
    set(n, prog(lt, 0, .2)); set(q, prog(lt, .05, .25), 0, (1 - E.out(prog(lt, .05, .35))) * -40);
    const c = prog(lt, .1, .4); set(box, clamp(c * 2), 0, (1 - E.back(c)) * 200, .9 + .1 * E.out(c));
    const rev = E.out(prog(lt, R, .4));
    im.style.transform = `scale(${Z - (Z - 1) * rev})`; im.style.transformOrigin = d.origin || "50% 38%";
    im.style.filter = `blur(${(1 - rev) * (BL - BL * .45 * prog(lt, .4, R - .4))}px) saturate(${1 + (1 - rev) * .4})`;
    const left = Math.max(0, R - lt), tick = Math.ceil(left / ((R - .5) / 3));
    ring.style.opacity = lt < R ? prog(lt, .4, .2) : 1 - prog(lt, R, .2);
    arc.style.strokeDashoffset = 402 * (1 - clamp(left / (R - .4)));
    num.textContent = Math.max(1, Math.min(3, tick));
    flash.style.opacity = rev > 0 && rev < 1 ? (1 - prog(lt, R, .35)) * .45 : 0;
    const k = prog(lt, R + .2, .35); set(name, k > 0 ? 1 : 0, 0, (1 - E.back(k)) * 120, .6 + .4 * E.back(k));
    if (pill) { const kp = prog(lt, R + .55, .3); set(pill, kp, 0, (1 - E.out(kp)) * 40); }
  }};
};

/* ---------- montaggio: scene in fila con transizione a frusta ---------- */
let acc = 0;
const S = V.scenes.map(d => { const s = el("div", "scene"); const sc = B[d.type](d, s); const o = {s, start: acc, ...sc}; acc += sc.dur; return o; });
const TOTAL = acc;
const mark = el("div", "mark", `Dub<span class="grad">ITA</span>`);

function render(t) {
  blobs.forEach((b, i) => { const a = t * (.35 + i * .12) + i * 1.7;
    b.style.left = (540 + Math.cos(a) * (260 + i * 40) - b.offsetWidth / 2) + "px"; b.style.top = (900 + Math.sin(a * 1.3) * (420 + i * 30) - b.offsetHeight / 2) + "px"; });
  bar.style.width = (t / TOTAL * 100) + "%";
  S.forEach((o, i) => {
    const lt = t - o.start, first = i === 0, last = i === S.length - 1;
    const vis = lt > (first ? -1 : -.2) && lt < o.dur + (last ? 99 : .1);
    o.s.style.opacity = vis ? 1 : 0; if (!vis) return;
    const inK = first ? 1 : E.out(prog(lt, -.15, .35)), outK = last ? 0 : E.in(prog(lt, o.dur - .25, .3));
    o.s.style.transform = `translateX(${(1 - inK) * 1100 - outK * 1100}px)`;
    o.s.style.filter = (1 - inK) + outK > .01 ? `blur(${(1 - inK) * 30 + outK * 30}px)` : "none";
    o.draw(lt);
  });
  mark.style.opacity = S[S.length - 1].start - .3 < t ? 0 : .55;
}
window.render = render; window.TOTAL = TOTAL;
render(0);
</script></body></html>
